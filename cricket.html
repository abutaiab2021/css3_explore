<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket Khele</title>
    <style>
        .bat{
            height: 300px;
            width: 300px;
        }
        .field{
            border: 2px solid green;       
        }
        .bat{
            transition: transform 0.1s;
        }
        
        .ball{
            height: 50px;
            width: 50px;
            background-color: red;
            border-radius: 50%;
            position: relative;
            left: 400px;
            bottom:50px;
            transition: transform 1s ease-out 0.1s;
        }

        .field:hover .bat{
            transform: rotate(-60deg);
            transform-origin: top right;
        }

         .field:hover .ball{
            transform: translate(500px, -310px);
        }

    </style>
</head>
<body>
    <h1>We Explore Cricket Bat and Ball</h1>
    <div class="field">
        <img src="images/bat.jpeg" class="bat" alt="">
        <div class="ball"></div>
    </div>
</body>
</html>
